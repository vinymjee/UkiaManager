name = "ukia-caisse"
main = "src/index.ts"
compatibility_date = "2026-01-01"

# Liaison KV : créez-la avec  npx wrangler kv:namespace create CAISSE_DB
# puis collez l'id ici.
[[kv_namespaces]]
binding = "CAISSE_DB"
id = "d59f8fda317b4f009d6ded733e7b1aa7"

[vars]
JWT_SECRET = "changez-moi-en-production-une-cle-secrete-32-caracteres"

# Assets statiques (build Angular) servis par le Worker.
# Le Worker gère /api/* et sert l'application Angular pour tout le reste.
[assets]
directory = "./ui/dist/ukia-caisse-ui/browser"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"